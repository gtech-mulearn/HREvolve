name: Repository Keepalive

# GitHub automatically disables scheduled (cron) workflows after 60 days
# with no repository activity - which silently killed keep-supabase-active.yml
# and let the Supabase project auto-pause. This workflow makes a small
# automated commit periodically so the repo never goes quiet long enough
# for that to happen again. Implemented directly (no third-party action)
# to avoid depending on external, unverified marketplace actions.

on:
  schedule:
    # Monthly - comfortably inside the 60-day disable window
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record keepalive timestamp
        run: |
          mkdir -p .github
          echo "Last keepalive run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/.keepalive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: keepalive commit to prevent GitHub Actions auto-disable"
          git push
