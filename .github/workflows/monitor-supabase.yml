name: Monitor Supabase Status

on:
  schedule:
    # Check daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check-supabase:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Supabase Status
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://ueutwediubqrcevqzojz.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVldXR3ZWRpdWJxcmNldnF6b2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyMTk2ODQsImV4cCI6MjA3Mzc5NTY4NH0.8TXl10oz_QrbWgu6dYtE6c-wCn1X_knjrYqSwCYlAwM"
      run: |
        # Test database connectivity
        response=$(curl -s -w "%{http_code}" -o /dev/null "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" \
          -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY")
        
        if [ "$response" -eq 200 ]; then
          echo "✅ Supabase is active and healthy"
        else
          echo "❌ Supabase may be paused or having issues (HTTP: $response)"
          # Fail the job so GitHub emails repo watchers about the failed
          # scheduled run - otherwise this check silently reported "success"
          # even when Supabase was actually down.
          exit 1
        fi